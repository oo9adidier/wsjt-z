name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable core.autocrlf before checkout
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-multimedia
            mingw-w64-ucrt-x86_64-qt5-serialport
            mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-qt5-tools
            mingw-w64-ucrt-x86_64-qt5-websockets
            mingw-w64-ucrt-x86_64-qt5-activeqt
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-nsis
            autoconf automake libtool

      - name: Cache Hamlib
        id: hamlib-cache
        uses: actions/cache@v4
        with:
          path: hamlib-prefix
          key: hamlib-windows-4.6.5-v1

      - name: Build Hamlib
        if: steps.hamlib-cache.outputs.cache-hit != 'true'
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          git clone --depth 1 --branch 4.6.5 https://github.com/Hamlib/Hamlib.git hamlib-src
          cd hamlib-src
          ./bootstrap
          ./configure \
            --prefix="${WORKSPACE}/hamlib-prefix" \
            --enable-shared --disable-static \
            --without-cxx-binding \
            --without-readline \
            CFLAGS="-DNDEBUG -g -O2 -fdata-sections -ffunction-sections -include assert.h" \
            LDFLAGS="-Wl,--gc-sections"
          make -j$(nproc)
          make install-strip

      - name: Install OmniRig
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.dxatlas.com/OmniRig/Files/OmniRig.zip" -OutFile OmniRig.zip
          Expand-Archive -Path OmniRig.zip -DestinationPath omnirig-extract
          $setup = Get-ChildItem -Path omnirig-extract -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $setup) { throw "No installer found in OmniRig.zip" }
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/NORESTART' -Wait
          $omnirig = Get-ChildItem -Path "C:\Program Files*\Afreet\OmniRig" -Filter "OmniRig.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $omnirig) { throw "OmniRig install failed - OmniRig.exe not found" }
          echo "OMNIRIG_PATH=$($omnirig.FullName)" >> $env:GITHUB_ENV

      - name: Fix dumpcpp name (MSYS2 ships dumpcpp-qt5)
        run: |
          ln -sf "${MINGW_PREFIX}/bin/dumpcpp-qt5.exe" "${MINGW_PREFIX}/bin/dumpcpp.exe"

      - name: Configure
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          OMNIRIG=$(cygpath "${OMNIRIG_PATH}")
          cmake -G "MSYS Makefiles" -S . -B wsjtx-build \
            -DCMAKE_PREFIX_PATH="${WORKSPACE}/hamlib-prefix" \
            -DOMNIRIG_TYPE_LIB="${OMNIRIG}" \
            -DCMAKE_Fortran_FLAGS="-fallow-argument-mismatch -std=legacy -fno-common" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DWSJT_SKIP_MANPAGES=ON \
            -DWSJT_GENERATE_DOCS=OFF \
            -DWSJT_BUILD_UTILS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -Wno-error -fpermissive -Wno-narrowing" \
            -Wno-dev

      - name: Build
        run: |
          cmake --build wsjtx-build -j$(nproc) || {
            echo "::warning::Parallel build failed, retrying single-threaded"
            cmake --build wsjtx-build -j1
          }

      - name: Package NSIS installer
        run: |
          cd wsjtx-build
          cpack -G NSIS -V
          ls -la *.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: wsjtz-windows-installer
          path: wsjtx-build/*win64*.exe
          if-no-files-found: error
